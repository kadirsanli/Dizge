<script>
// Bu dosya tek başına çalışır. Dizge.js yukarıda gömülüdür; ağ isteği yapılmaz.
const { arayüz, veri, istatistik, biçim, csv, indir, depo } = Dizge;

const başlangıç = [
  { ürün: 'Kalem', kategori: 'Kırtasiye', tutar: 30, tarih: '2026-10-01' },
  { ürün: 'Defter', kategori: 'Kırtasiye', tutar: 80, tarih: '2026-10-01' },
  { ürün: 'Kulaklık', kategori: 'Elektronik', tutar: 1250, tarih: '2026-10-02' },
  { ürün: 'Kahve', kategori: 'Gıda', tutar: 145, tarih: '2026-10-02' },
  { ürün: 'Kablo', kategori: 'Elektronik', tutar: 220, tarih: '2026-10-03' }
];

const mağaza = depo(başlangıç);
let satırlar = başlangıç;
let karanlık = false;

const durum = arayüz.öğe('p', { role: 'status', class: 'dz-muted' }, 'Veriler yalnızca bu tarayıcıda kalır.');
const ölçütler = arayüz.ızgara();
const grafikAlanı = arayüz.öğe('div');

  satırlar,
  sayfaBoyu: 5,
  etiket: 'Satış tablosu',
  sütunlar: [
    { anahtar: 'ürün', etiket: 'ÜRÜN' },
    { anahtar: 'kategori', etiket: 'KATEGORİ' },
    { anahtar: 'tarih', etiket: 'TARİH' },
    { anahtar: 'tutar', etiket: 'TUTAR', biçimle: değer => biçim.para(değer) }
  ]

function grafiğiÇiz() {
  const gruplar = veri(satırlar).grupla('kategori').özetle({
    toplam: t => istatistik.özet(t.sütun('tutar')).toplam
  }).diziye();
  grafikAlanı.replaceChildren(arayüz.kart('Kategori dağılımı', arayüz.grafik({
    değerler: gruplar.map(g => g.toplam),
    etiketler: gruplar.map(g => g.kategori),
    etiket: 'Kategoriye göre toplam tutar'

  satırlar = yeni;
  const özet = istatistik.özet(satırlar.map(s => s.tutar));
  ölçütler.replaceChildren(
    arayüz.ölçüt('TOPLAM', biçim.para(özet.toplam), 'Tüm satışlar'),
    arayüz.ölçüt('SATIR', biçim.sayı(özet.sayı), 'Kayıt sayısı'),
    arayüz.ölçüt('ORTALAMA', biçim.para(özet.ortalama ?? 0), 'Eksik değerler hariç')

  grafiğiÇiz();

  başlık: 'Tek dosya, Türkçe kod.',
  altBaşlık: 'Dizge.js gömülü; harici dosya yok. Sağ tıkla kaynağı aç, Türkçe oku.',
  eylemler: [
