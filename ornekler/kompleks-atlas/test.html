<!doctype html><html lang="tr"><meta charset="utf-8"><title>Ortak karşılaştırma testi</title><style>body{background:#151921;color:#eef3fc;font:15px system-ui;margin:24px}button,a{padding:10px;color:inherit}button{background:#384758;cursor:pointer}iframe{width:100%;height:760px;border:1px solid #586879}pre{white-space:pre-wrap;word-break:break-all}a{color:#b9e985}</style><h1>Ortak test tezgâhı</h1><p>Yerel sunucu üzerinden kullanın. Test sırası, dış referanslar ve örnek sayısı iki sürümde aynıdır. Ölçüm sırasında bu sekmeyi görünür tutun.</p><p><button onclick="run('normal')">A / Normal test et</button> <button onclick="run('dizge')">B / Dizge test et</button> <button id="download" disabled>Sonucu JSON indir</button> <a href="normal.html">Normal aç</a> <a href="dizge.html">Dizge aç</a></p><p id="status" role="status">Hazır</p><iframe id="frame" title="Test edilen uygulama"></iframe><pre id="result"></pre><script src="test-sistemi.js"></script><script>
let lastResult;async function run(name){document.querySelectorAll('button').forEach(b=>b.disabled=true);document.getElementById('status').textContent=name+' test ediliyor…';const f=document.getElementById('frame');try{await new Promise((resolve,reject)=>{f.onload=resolve;f.onerror=reject;f.src=name+'.html'});lastResult={method:name,...await auditAtlas(f)};document.getElementById('result').textContent=JSON.stringify(lastResult,null,2);document.getElementById('status').textContent=`${lastResult.passed}/${lastResult.total} kontrol geçti.`}catch(e){document.getElementById('status').textContent='Test hatası: '+e.message}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}document.getElementById('download').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(lastResult,null,2)],{type:'application/json'}));a.href=u;a.download=lastResult.method+'-test.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></html>
