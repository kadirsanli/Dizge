<!doctype html><html lang="tr"><meta charset="utf-8"><title>Zor Deney · Dış arayüz kontrolü</title><style>body{background:#111923;color:#e7f0fc;font:14px system-ui;margin:24px}button{padding:12px;background:#294357;color:white;border:1px solid #708d9d;cursor:pointer}iframe{width:100%;height:800px;border:1px solid #516579}pre{white-space:pre-wrap}</style><h1>Dış arayüz kontrolleri</h1><button onclick="run('normal')">Normal arayüzü test et</button> <button onclick="run('dizge')">Dizge arayüzünü test et</button><p id="status" role="status">Hazır.</p><iframe id="app" title="Test edilen üçlü laboratuvar"></iframe><pre id="out"></pre><script>
async function run(method){const results=[],check=(name,pass,detail='')=>results.push({name,pass:!!pass,detail});document.querySelectorAll('button').forEach(b=>b.disabled=true);const frame=document.getElementById('app');document.getElementById('status').textContent='Çalışıyor…';try{await new Promise((resolve,reject)=>{frame.onload=resolve;frame.onerror=reject;frame.src=method+'-zor.html'});const w=frame.contentWindow,a=w.lab,doc=w.document;await a.set({lab:'newton',formula:'z^3-1',grid:32});check('Gerçek 3B örgü',a.stats().mesh.vertices===1089&&a.stats().mesh.triangles===2048);const c=doc.querySelector('canvas'),start=a.exportSettings();c.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));check('Klavye yörünge',a.exportSettings().settings.yaw>start.settings.yaw);c.dispatchEvent(new w.KeyboardEvent('keydown',{key:'+',bubbles:true}));check('Klavye yakınlaşma',a.exportSettings().settings.zoom<start.settings.zoom);c.dispatchEvent(new w.KeyboardEvent('keydown',{key:'r',bubbles:true}));check('Kamera sıfırlama',a.exportSettings().settings.yaw===start.settings.yaw&&a.exportSettings().settings.zoom===start.settings.zoom);
await a.set({lab:'gravity',bodies:2});doc.getElementById('step').click();check('N-cisim gerçek adım',a.stats().stepCount===1);doc.getElementById('play').click();check('Oynat düğmesi',doc.getElementById('play').getAttribute('aria-pressed')==='true');doc.getElementById('play').click();check('Duraklat düğmesi',doc.getElementById('play').getAttribute('aria-pressed')==='false');await a.set({lab:'quantum',qgrid:32,potential:'free'});doc.getElementById('step').click();check('Dalga gerçek adım/norm',a.stats().stepCount===1&&Math.abs(a.stats().simulation.norm-1)<1e-10);
const saved=JSON.stringify(a.exportSettings());await a.set({potential:'slit',qgrid:64});await a.importSettings(saved);check('Gerçek uygulama JSON gidiş dönüşü',saved===JSON.stringify(a.exportSettings()));for(const text of['{bad}',JSON.stringify({app:'zor-deney',version:2,settings:{}}),JSON.stringify({app:'zor-deney',version:1,settings:{lab:'newton'}}),JSON.stringify({...a.exportSettings(),settings:{...a.exportSettings().settings,lab:['newton']}})]){const before=JSON.stringify(a.exportSettings());let rejected=false;try{await a.importSettings(text)}catch(e){rejected=true}check('Atomik JSON reddi '+text.slice(0,40),rejected&&before===JSON.stringify(a.exportSettings()))}
const p1=a.set({lab:'newton',formula:'sin(z)',grid:96}),p2=a.set({formula:'z^3-1',grid:32});await Promise.all([p1,p2]);check('Eski Newton üretimi iptal edildi',a.exportSettings().settings.formula==='z^3-1'&&a.stats().mesh.vertices===1089);const field=doc.getElementById('x');field.value='';check('Boş başlangıç native reddi',!field.checkValidity());field.value='.4';check('PNG gerçek kodlama',c.toDataURL('image/png').length>10000);check('Üç görev sekmesi',doc.querySelectorAll('[role=tab]').length===3);check('Tek parametre paneli',Array.from(doc.querySelectorAll('section[id$=Controls]')).filter(e=>!e.hidden).length===1);
for(const key of['pole','zero','memory']){doc.querySelector('[data-limit="'+key+'"]').click();const r=JSON.parse(doc.getElementById('limitResult').textContent);check('Sınır düğmesi '+key,r.solved===false&&r.rejected===true)}
const result={method,at:new Date().toISOString(),passed:results.filter(x=>x.pass).length,total:results.length,results};document.getElementById('out').textContent=JSON.stringify(result,null,2);document.getElementById('status').textContent=result.passed+'/'+result.total+' geçti.'}catch(e){document.getElementById('status').textContent='Hata: '+e.message}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
</script></html>
